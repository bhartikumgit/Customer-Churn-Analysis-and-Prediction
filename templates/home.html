<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churn Prediction Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #333;
    }

    .box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: fadeInUp 1s ease-out;
      max-width: 90%;
      width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin-bottom: 20px;
      color: #4a5568;
      font-size: 28px;
      font-weight: 700;
    }

    p {
      color: #718096;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin: 10px;
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 12px;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      border: none;
      cursor: pointer;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Churn Prediction Portal</h1>
    <p>Welcome to the Churn Prediction Portal. This tool uses a Random Forest model trained on customer data to predict churn likelihood and provide actionable insights.</p>

    <a href="/analyse">
      <i class="fas fa-chart-line"></i> Analyse Dataset
    </a>
    <a href="/predict_form">
      <i class="fas fa-search"></i> Customer Lookup
    </a>
  </div>
</body>
</html>
