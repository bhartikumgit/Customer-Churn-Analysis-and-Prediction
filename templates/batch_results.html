<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Results</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .stat-icon { font-size: 2.5em; margin-bottom: 10px; }
        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .stat-value.danger { color: #ff6b6b; }
        .stat-label { color: #666; font-size: 0.95em; }
        
        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .chart-title { font-size: 1.3em; color: #333; margin-bottom: 15px; font-weight: 600; }
        .chart-wrapper { position: relative; height: 280px; }
        
        .recommendations {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            border-left: 5px solid #ffc107;
        }
        .recommendations h3 { color: #856404; margin-bottom: 15px; font-size: 1.4em; }
        .recommendations ul { list-style: none; padding: 0; }
        .recommendations li {
            padding: 10px 0;
            color: #856404;
            border-bottom: 1px solid #f0f0f0;
        }
        .recommendations li:before { content: "💡 "; margin-right: 10px; }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/analysis_choice" class="back-btn">← Back</a>
        
        <div class="header">
            <h1>📊 Batch Analysis Results</h1>
            <p>Complete dataset analytics</p>
        </div>

        <div id="content"></div>
    </div>

    <script>
    const data = {{ results|tojson|safe }};
    
    const html = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value">${data.total_customers}</div>
                <div class="stat-label">Total Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚠️</div>
                <div class="stat-value danger">${data.churn_count}</div>
                <div class="stat-label">Will Churn</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-value danger">${data.churn_percentage}%</div>
                <div class="stat-label">Churn Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔴</div>
                <div class="stat-value danger">${data.high_risk_count}</div>
                <div class="stat-label">High Risk</div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-card">
                <div class="chart-title">📊 Churn Distribution</div>
                <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">⚠️ Risk Levels</div>
                <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
            </div>
        </div>

        <div class="recommendations">
            <h3>💡 Key Insights & Recommendations</h3>
            <ul>
                <li>${data.churn_percentage > 25 ? 'CRITICAL: ' : ''}Churn rate is ${data.churn_percentage}% - ${data.high_risk_count} customers need immediate attention</li>
                <li>Focus retention efforts on the ${data.high_risk_count} high-risk customers (>70% probability)</li>
                ${data.avg_tenure ? `<li>Average tenure: ${data.avg_tenure} months ${data.avg_tenure < 12 ? '- improve early onboarding' : ''}</li>` : ''}
                <li>Implement personalized retention campaigns for at-risk segments</li>
                <li>Analyze common patterns among churning customers to identify systemic issues</li>
            </ul>
        </div>

        <div class="action-buttons">
            <form method="POST" action="/download_report" style="display: inline;">
                <input type="hidden" name="total" value="${data.total_customers}">
                <input type="hidden" name="churn_count" value="${data.churn_count}">
                <input type="hidden" name="churn" value="${data.churn_percentage}">
                <input type="hidden" name="high_risk" value="${data.high_risk_count}">
                <button type="submit" class="btn btn-primary">📄 Download Report</button>
            </form>
            <a href="/individual_analysis" class="btn btn-secondary">👤 Individual Analysis</a>
            <a href="/upload" class="btn btn-secondary">📁 New Dataset</a>
        </div>
    `;
    
    document.getElementById('content').innerHTML = html;

    // Charts
    const total = data.total_customers;
    const churn = data.churn_count;
    const stay = total - churn;

    // Pie Chart
    new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
            labels: ['Will Churn', 'Will Stay'],
            datasets: [{
                data: [churn, stay],
                backgroundColor: ['#ff6b6b', '#51cf66'],
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { padding: 15 } }
            }
        }
    });

    // Bar Chart
    const highRisk = data.high_risk_count;
    const mediumRisk = Math.round(total * 0.25);
    const lowRisk = total - highRisk - mediumRisk;

    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: ['High\n(>70%)', 'Medium\n(40-70%)', 'Low\n(<40%)'],
            datasets: [{
                label: 'Customers',
                data: [highRisk, mediumRisk, lowRisk],
                backgroundColor: ['#ff6b6b', '#ffa94d', '#51cf66'],
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                x: { grid: { display: false } }
            }
        }
    });
</script>
</body>
</html>
