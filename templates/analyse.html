<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse Dataset</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #333;
    }

    .box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: fadeInUp 1s ease-out;
      max-width: 90%;
      width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin-bottom: 20px;
      color: #4a5568;
      font-size: 28px;
      font-weight: 700;
    }

    p {
      color: #718096;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      background: #f7fafc;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 12px;
      border: none;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    a:hover {
      color: #5a67d8;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1><i class="fas fa-upload"></i> Analyse Dataset</h1>
    <p>Upload a CSV or Excel file to analyse churn patterns, percentages, reasons, and demographics.</p>

    <form method="post" enctype="multipart/form-data">
      <input type="file" name="dataset" accept=".csv,.xls,.xlsx" required />
      <button type="submit"><i class="fas fa-play"></i> Analyse</button>
    </form>

    <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
  </div>
</body>
</html>
